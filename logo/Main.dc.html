<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');
    html, body { margin: 0; height: 100%; }
    .stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: transparent; }
    svg { width: 100%; height: 100%; }
    text { font-family: 'Space Grotesk', system-ui, sans-serif; }
  </style>
</helmet>
<div class="stage">
  <svg viewBox="0 0 920 260" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="brandGrad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#22D3EE"/>
        <stop offset="55%" stop-color="#6366F1"/>
        <stop offset="100%" stop-color="#A855F7"/>
      </linearGradient>
    </defs>

    <rect x="0" y="0" width="920" height="260" rx="28" style="fill: {{bg}}"/>

    <g transform="translate(40,46) scale(1.4)">
      <rect x="6" y="6" width="108" height="108" rx="26" style="fill: {{tile}}"/>

      <path d="M 83,20.2 A 46,46 0 1 1 16.8,44.3" fill="none" stroke="url(#brandGrad)" stroke-width="5" stroke-linecap="round"/>
      <polygon points="18.85,38.66 20.13,49.77 10.73,46.35" fill="url(#brandGrad)"/>

      <rect x="32" y="36" width="56" height="48" rx="8" fill="none" style="stroke: {{frame}}" stroke-width="3"/>
      <line x1="35" y1="50" x2="85" y2="50" style="stroke: {{frame}}" stroke-width="1.6" opacity="0.7"/>

      <line x1="60" y1="68" x2="60" y2="56" stroke="url(#brandGrad)" stroke-width="2" opacity="0.9"/>
      <line x1="60" y1="68" x2="74" y2="68" stroke="url(#brandGrad)" stroke-width="2" opacity="0.9"/>
      <line x1="60" y1="68" x2="60" y2="80" stroke="url(#brandGrad)" stroke-width="2" opacity="0.9"/>
      <line x1="60" y1="68" x2="46" y2="68" stroke="url(#brandGrad)" stroke-width="2" opacity="0.9"/>

      <circle cx="60" cy="56" r="3" fill="url(#brandGrad)"/>
      <circle cx="74" cy="68" r="3" fill="url(#brandGrad)"/>
      <circle cx="60" cy="80" r="3" fill="url(#brandGrad)"/>
      <circle cx="46" cy="68" r="3" fill="url(#brandGrad)"/>
      <circle cx="60" cy="68" r="5" fill="url(#brandGrad)"/>

      <path d="M 53.94,13.5 A 7,7 0 0 1 66.06,13.5" fill="none" stroke="url(#brandGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
      <path d="M 56.54,15 A 4,4 0 0 1 63.46,15" fill="none" stroke="url(#brandGrad)" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="60" cy="17" r="1.8" fill="url(#brandGrad)"/>
    </g>

    <text x="255" y="130" font-size="90" font-weight="700" letter-spacing="-1.5" dominant-baseline="central">
      <tspan fill="url(#brandGrad)">Ai</tspan><tspan style="fill: {{text}}">buildapp</tspan>
    </text>
  </svg>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":true,"section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? true;
    return {
      bg: dark ? '#0A0E1A' : '#F5F7FB',
      tile: dark ? '#0A0E1A' : '#F5F7FB',
      frame: dark ? '#94A3B8' : '#475569',
      text: dark ? '#F5F7FB' : '#10121A'
    };
  }
}
</script>
</body>
</html>
